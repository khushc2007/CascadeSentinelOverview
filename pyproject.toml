[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-doomsday-finder"
version = "0.1.0"
description = "Constrained quantum-search benchmark for worst-case N-k cascading outages (design: V2.0)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "networkx>=3.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "import-linter"]
reference = ["pandapower>=2.14"]   # optional cross-checks only (U2/U7/E0); never imported by the engine
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14"]
analysis = ["scikit-learn>=1.3", "matplotlib>=3.8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["doomsday*"]

[tool.setuptools.package-data]
"doomsday.gridtwin" = ["data/*.m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
